<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invella — управление</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#f3eee6;
  --paper:#fffdf9;
  --ink:#191510;
  --muted:#786e64;
  --line:#ddd3c7;
  --gold:#9a7951;
  --red:#a04444;
  --green:#4f7657;
}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}
button,input,select{font:inherit}
button{cursor:pointer}

.shell{
  max-width:1100px;
  margin:auto;
  padding:22px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:28px;
}

.logo{
  font-family:Georgia,serif;
  font-size:25px;
  letter-spacing:.2em;
}

h1,h2,h3{
  font-family:Georgia,serif;
  font-weight:400;
}

h1{font-size:42px;margin:5px 0}
h2{font-size:30px;margin:0 0 18px}

.muted{
  color:var(--muted);
  line-height:1.5;
}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
}

.hidden{display:none!important}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:20px;
}

.tabs button{
  flex:1 1 auto;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  background:var(--ink);
  color:#fff;
}

button.secondary{
  background:#eee7de;
  color:var(--ink);
}

button.danger{
  background:var(--red);
}

button.green{
  background:var(--green);
}

.tabs button.active{
  background:var(--gold);
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
}

.field{
  margin:12px 0;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:6px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.search{
  margin-bottom:18px;
}

.item{
  border-top:1px solid var(--line);
  padding:18px 0;
}

.item:first-child{
  border-top:0;
}

.item-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.item-title{
  font-family:Georgia,serif;
  font-size:22px;
}

.meta{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin-top:6px;
  word-break:break-word;
}

.badge{
  display:inline-block;
  border-radius:999px;
  padding:5px 9px;
  background:#eee7de;
  font-size:11px;
  text-transform:uppercase;
}

.badge.published{
  background:#e5f0e6;
  color:#315b38;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.actions button{
  padding:9px 11px;
  font-size:12px;
}

.message{
  padding:13px;
  border-radius:10px;
  margin:12px 0;
  line-height:1.4;
}

.message.ok{
  background:#e7f1e7;
  color:#315b38;
}

.message.error{
  background:#f5e4e4;
  color:#8a3434;
}

.promo-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  border-top:1px solid var(--line);
  padding:15px 0;
}

.promo-row:first-child{border-top:0}

.promo-code{
  font-family:Georgia,serif;
  font-size:22px;
}

.loading{
  text-align:center;
  padding:35px;
  color:var(--muted);
}

@media(max-width:650px){
  .shell{padding:15px}
  h1{font-size:34px}
  .grid{grid-template-columns:1fr}
  .item-head,.promo-row{display:block}
  .item-head .badge{margin-top:8px}
  .promo-row button{margin-top:10px}
}
</style>

<body><div id="invellaBootStatus" class="boot-status" hidden role="status"><span></span><button type="button" onclick="invellaRetryBoot()">Повторить</button></div><noscript><p>Для входа и редактора нужно разрешить JavaScript для invella.ru в настройках браузера.</p></noscript>

<div class="shell">

<header>
  <div class="logo">INVELLA</div>
  <button class="secondary" onclick="logout()">Выйти</button>
</header>

<div id="loading" class="card loading">
  Проверяем доступ…
</div>

<div id="loginBox" class="card hidden">
  <h1>Управление Invella</h1>
  <p class="muted">
    Войдите под администраторским аккаунтом.
  </p>

  <div class="field">
    <label>Email</label>
    <input id="email" type="email" autocomplete="email">
  </div>

  <div class="field">
    <label>Пароль</label>
    <input id="password" type="password" autocomplete="current-password">
  </div>

  <button data-shell="login">Войти</button>

  <div id="loginMessage"></div>
</div>

<div id="admin" class="hidden">

  <h1>Управление Invella</h1>
  <p class="muted">
    Приглашения, ручная активация тарифов и промокоды.
  </p>

  <div class="tabs">
    <button id="tabInv"
            class="active"
            onclick="showTab('invitations')">
      Приглашения
    </button>

    <button id="tabPromo"
            onclick="showTab('promos')">
      Промокоды
    </button>
    <button id="tabPayments" onclick="showTab('payments')">Оплаты</button>
  </div>

  <section id="invitationsTab">

    <div class="card">

      <h2>Приглашения</h2>

      <input
        id="search"
        class="search"
        placeholder="Поиск по имени, email, ссылке…"
        oninput="renderInvitations()"
      >

      <div id="invitationMessage"></div>

      <div id="invitations"></div>

    </div>

  </section>

  <section id="paymentsTab" class="hidden">
    <div class="card">
      <h2>Сверка оплат</h2>
      <p class="muted">Проверка операций напрямую в ЮKassa.</p>
      <div class="grid">
        <div class="field"><label>С даты</label><input id="paymentsFrom" type="date" value="2026-09-01"></div>
        <div class="field"><label>По дату включительно</label><input id="paymentsTo" type="date" value="2026-09-02"></div>
        <div class="field"><label>Сумма, ₽</label><input id="paymentsAmount" type="number" min="0" value="990"></div>
      </div>
      <button type="button" onclick="loadPayments()">Найти оплаты</button>
      <div id="paymentsResult" aria-live="polite"></div>
    </div>
  </section>

  <section id="promosTab" class="hidden">

    <div class="card">

      <h2>Создать промокод</h2>

      <div class="grid">

        <div class="field">
          <label>Код</label>
          <input
            id="promoCode"
            placeholder="Например WEDDING10"
          >
        </div>

        <div class="field">
          <label>Тип скидки</label>
          <select id="discountType">
            <option value="percent">Процент</option>
            <option value="fixed">Фиксированная сумма</option>
          </select>
        </div>

        <div class="field">
          <label>Размер скидки</label>
          <input
            id="discountValue"
            type="number"
            min="1"
            placeholder="10"
          >
        </div>

        <div class="field">
          <label>Тариф</label>
          <select id="planKey">
            <option value="">Все тарифы</option>
            <option value="basic">Basic</option>
            <option value="pro">Pro</option>
            <option value="premium">Premium</option>
          </select>
        </div>

        <div class="field">
          <label>Количество использований</label>
          <input
            id="maxUses"
            type="number"
            min="1"
            placeholder="Без ограничения"
          >
        </div>

        <div class="field">
          <label>Действует до</label>
          <input
            id="expiresAt"
            type="datetime-local"
          >
        </div>

      </div>

      <button onclick="createPromo()">
        Создать промокод
      </button>

      <div id="promoMessage"></div>

    </div>

    <div class="card">

      <h2>Промокоды</h2>

      <div id="promos"></div>

    </div>

  </section>

</div>

</div>





<span id="invellaShellReady" hidden></span></body>
  </html>
