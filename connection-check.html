<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Проверка подключения — Invella</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f2ea;color:#201b17;font:16px/1.5 Arial,sans-serif}main{max-width:760px;margin:40px auto;padding:24px}h1{font:32px Georgia,serif}li{padding:14px 0;border-bottom:1px solid #d8cdbf}small{display:block;color:#695e54}button,a{display:inline-block;padding:12px 18px;margin:12px 8px 0 0;border:1px solid #a58b6b;border-radius:8px;background:#fff;color:#201b17}textarea{width:100%;min-height:180px;padding:12px;font:13px/1.5 monospace}#result{padding:16px;background:#fff;border-radius:10px}button:disabled{opacity:.5}</style></head>
<body><main><p>INVELLA · проверка подключения</p><h1>Что мешает открыть сайт?</h1><p id="state" role="status">Проверяем загрузку. Это займёт до 15 секунд.</p><ul id="checks" aria-live="polite"></ul><p id="result">Здесь появится результат.</p><button id="copy" disabled>Скопировать результат</button><button id="retry" disabled>Повторить проверку</button><a href="/">Открыть сайт</a><textarea id="report" readonly aria-label="Результат проверки" hidden></textarea><p><small>Результаты загрузки автоматически отправятся в технический журнал Invella: статус, объём файла и время ответа.</small></p><noscript>В браузере отключён JavaScript. Для работы редактора Invella его нужно включить.</noscript></main>
<script>
'use strict';
var checks=[['Главная страница','/'],['Оформление страницы','/assets/invella-bundle.css?v=20261026-media-verified-2'],['Модуль входа','/supabase.min.js?v=20261001-stable-1'],['Код сайта','/assets/invella-app.js?v=20261026-media-verified-2'],['Редактор фото и музыки','/assets/invella-premium-fix.js?v=20261026-media-verified-2'],['Сервер входа','/sb/auth/v1/health']];
async function checkResource(path,label,timeoutMs,onProgress){
 var started=Date.now(),bytes=0,code=0,controller=new AbortController(),expired=false;
 var timer=setTimeout(function(){expired=true;controller.abort()},timeoutMs);
 try{
  var headers=path.indexOf('/sb/')===0?{apikey:'sb_publishable_EY50r1gV7v1zyD9vBgrteA_JVcOg4_J'}:{};
  var response=await fetch(path,{cache:'no-store',headers:headers,signal:controller.signal});code=response.status;
  if(!response.ok)return{label:label,status:'http',code:code,bytes:0,ms:Date.now()-started};
  if(response.body&&response.body.getReader){var reader=response.body.getReader();while(true){var part=await reader.read();if(part.done)break;bytes+=part.value.byteLength;if(onProgress)onProgress(bytes)}}else bytes=(await response.arrayBuffer()).byteLength;
  return{label:label,status:'ok',code:code,bytes:bytes,ms:Date.now()-started};
 }catch(error){return{label:label,status:expired?'timeout':'network',code:code,bytes:bytes,ms:Date.now()-started}}finally{clearTimeout(timer)}
}
async function sendReport(results){
 var controller=new AbortController(),timer=setTimeout(function(){controller.abort()},8000);
 try{var response=await fetch('/api/connection-report',{method:'POST',credentials:'omit',referrerPolicy:'no-referrer',headers:{'Content-Type':'application/json'},body:JSON.stringify({checks:results.map(function(r){return{status:r.status,code:r.code,bytes:r.bytes,ms:r.ms}})}),signal:controller.signal});if(!response.ok)throw new Error('Report failed');return await response.json()}finally{clearTimeout(timer)}
}
var busy=false;
async function run(){
 if(busy)return;busy=true;document.getElementById('copy').disabled=true;document.getElementById('retry').disabled=true;
 document.getElementById('state').textContent='Проверяем загрузку. Это займёт до 15 секунд.';document.getElementById('result').textContent='Проверка идёт…';document.getElementById('checks').textContent='';document.getElementById('report').hidden=true;
 var rows=checks.map(function(x){var row=document.createElement('li');row.textContent=x[0]+': проверяем…';document.getElementById('checks').appendChild(row);return row});
 var results=await Promise.all(checks.map(async function(x,i){var r=await checkResource(x[1],x[0],15000,function(bytes){rows[i].textContent=x[0]+': получено '+bytes+' байт…'});rows[i].textContent=r.label+': '+(r.status==='ok'?'загружено':r.status==='timeout'?'загрузка зависла':r.status==='http'?'ошибка HTTP '+r.code:'нет соединения')+' ('+r.bytes+' байт, '+(r.ms/1000).toFixed(1)+' сек.)';return r}));
 var failures=results.filter(function(x){return x.status!=='ok'}),verdict=failures.length?'Не загрузилось: '+failures.map(function(x){return x.label}).join(', ')+'. Отправляем результат проверки…':'Все файлы и сервер входа доступны из этого браузера. Отправляем результат проверки…';
 document.getElementById('result').textContent=verdict;
 document.getElementById('report').value='Invella: проверка подключения\n'+new Date().toISOString()+'\n'+results.map(function(x){return x.label+': '+x.status+', HTTP '+x.code+', '+x.bytes+' байт, '+x.ms+' мс'}).join('\n');
 document.getElementById('state').textContent='Проверка завершена.';document.getElementById('copy').disabled=false;
 try{var sent=await sendReport(results);document.getElementById('result').textContent=(failures.length?'Не загрузилось: '+failures.map(function(x){return x.label}).join(', ')+'. ':'Все файлы и сервер входа доступны. ')+'Результат автоматически отправлен в технический журнал Invella. Код проверки: '+sent.id+'. Можно вернуться в чат.'}catch(error){document.getElementById('result').textContent=verdict.replace('Отправляем результат проверки…','Результат не удалось отправить. Скопируй его или пришли фото этой страницы в чат.')}document.getElementById('retry').disabled=false;busy=false;
}
document.getElementById('copy').onclick=async function(){var report=document.getElementById('report');try{await navigator.clipboard.writeText(report.value);this.textContent='Скопировано — отправь в чат'}catch(error){report.hidden=false;report.focus();report.select();this.textContent='Скопируй выделенный результат'}};
document.getElementById('retry').onclick=run;
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
</script></body></html>
