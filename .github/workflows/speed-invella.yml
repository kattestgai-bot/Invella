name: Refresh Invella frontend
on:
  push:
    branches: [main]
    paths: ['.github/workflows/speed-invella.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy duplicate controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); h=p.read_text(encoding='utf-8')
          # Legacy static Pro/Premium blocks are replaced by the single unified v10 UI.
          patterns=[
            r'<div class="field"><label>Персональные ссылки для гостей.*?</div></div>',
            r'<div class="field"><label>Музыка.*?</div>',
            r'<div class="field"><label>Фотогалерея.*?</div>',
            r'<div class="field"><label>Таймер до события.*?</div>'
          ]
          for pat in patterns:
              h=re.sub(pat,'',h,flags=re.S)
          # Remove any remaining legacy Premium controls by their known ids.
          h=re.sub(r'<[^>]*id="(?:premiumMusic|premiumGallery|premiumTimer|guestNamesForLinks)"[^>]*>.*?</[^>]+>','',h,flags=re.S)
          h=re.sub(r"fetch\(B\+p(?:\+'\?v=[^']*')?\,\{cache:'no-store'\}\)","fetch(B+p+'?v=20260910-1240',{cache:'no-store'})",h)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'Invella Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove legacy duplicate editor controls'
          git push
