name: Refresh Invella frontend
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/speed-invella.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply launch fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/invella-premium-fix.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Персональные ссылки для гостей <span class="tag">PRO</span>','Персональные ссылки для гостей <span class="tag">PREMIUM</span>')
          s=s.replace("['quickLinksStable','premiumStablePanel','premiumEditorPreview','liveMediaPreviewV3','invUnifiedLinks','invUnifiedMedia']","['quickLinksStable','premiumStablePanel','premiumEditorPreview','liveMediaPreviewV3']")
          s=s.replace('function links(){var ns=',"function links(){if(plan!=='premium'){alert('Персональные ссылки доступны только в Premium.');return}var ns=")
          p.write_text(s,encoding='utf-8')
          h=Path('index.html').read_text(encoding='utf-8')
          premium_start=h.find('<div class="plan-name">Premium</div>')
          pro_link='<li>Персональные ссылки для гостей</li>'
          before=h[:premium_start]
          after=h[premium_start:]
          before=before.replace(pro_link,'')
          if pro_link not in after:
              after=after.replace('<li>Всё из Pro</li>','<li>Всё из Pro</li>'+pro_link,1)
          h=before+after
          h=re.sub(r"fetch\(B\+p(?:\+'\?v=[^']*')?\,\{cache:'no-store'\}\)","fetch(B+p+'?v=20260910-1415',{cache:'no-store'})",h)
          Path('index.html').write_text(h,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'Invella Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/invella-premium-fix.js
          git diff --cached --quiet || git commit -m 'Make personal links Premium only'
          git push
