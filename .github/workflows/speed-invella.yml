name: Validate Invella frontend
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current frontend
        run: |
          test -s index.html
          test -s assets/invella-app.js
          test -s assets/invella-premium-fix.js
          grep -q "guestPreviewBtn" index.html
          grep -q "invEnd" assets/invella-premium-fix.js
          echo "Current frontend preserved"