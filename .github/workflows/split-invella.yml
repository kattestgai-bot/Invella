name: Chunk Invella frontend
on:
  push:
    branches: [main]
    paths: ['.github/workflows/split-invella.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chunk large frontend responses
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')
          app=Path('assets/invella-app.js')
          if not app.exists(): raise SystemExit('assets/invella-app.js missing')
          js=app.read_text(encoding='utf-8')
          # Split only at safe top-level line boundaries. Existing source keeps top-level functions/statements on lines.
          lines=js.splitlines(True)
          chunks=[]; cur=''
          for line in lines:
              if cur and len((cur+line).encode('utf-8'))>12000:
                  chunks.append(cur); cur=''
              cur+=line
          if cur: chunks.append(cur)
          # Preserve one shared scope across chunks by stripping the outer IIFE only after recombination in loader.
          payload=[]
          for i,ch in enumerate(chunks,1):
              p=Path(f'assets/app-part-{i:02d}.txt'); p.write_text(ch,encoding='utf-8'); payload.append('/'+str(p))
          # Small resilient loader: fetch each <12KB piece with retries, concatenate, then execute as the original script.
          loader="""(function(){\nvar parts=PARTS;\nfunction sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}\nasync function get(url){var last;for(var i=0;i<6;i++){try{var r=await fetch(url+'?v=3',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);var t=await r.text();if(!t)throw new Error('empty');return t}catch(e){last=e;await sleep(250*(i+1))}}throw last}\n(async function(){try{var all=[];for(var i=0;i<parts.length;i++)all.push(await get(parts[i]));(0,eval)(all.join('\\n'))}catch(e){console.error('Invella startup failed',e);var d=document.createElement('div');d.style.cssText='position:fixed;z-index:99999;left:12px;right:12px;bottom:12px;padding:12px;background:white;border:1px solid #ddd;border-radius:12px;font:14px Arial';d.innerHTML='Не удалось полностью загрузить сайт. <button onclick=\"location.reload()\">Повторить</button>';document.body.appendChild(d)}})();\n})();\n""".replace('PARTS',repr(payload).replace("'",'"'))
          Path('assets/invella-loader.js').write_text(loader,encoding='utf-8')
          s=s.replace('<script src="/assets/invella-app.js" defer></script>','<script src="/assets/invella-loader.js" defer></script>')
          # Make stylesheet loads resilient too: current CSS files are already below the observed reset threshold.
          idx.write_text(s,encoding='utf-8')
          print('index',idx.stat().st_size,'loader',Path('assets/invella-loader.js').stat().st_size,'parts',[(p,Path(p[1:]).stat().st_size) for p in payload])
          PY
      - name: Validate
        run: |
          node --check assets/invella-loader.js
          grep -q '/assets/invella-loader.js' index.html
          test $(stat -c%s index.html) -lt 20000
          for f in assets/app-part-*.txt; do test $(stat -c%s "$f") -lt 20000; done
      - name: Commit repair
        run: |
          git config user.name 'Invella Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/
          git diff --cached --quiet && exit 0
          git commit -m 'Load Invella app in retryable small chunks'
          git push
