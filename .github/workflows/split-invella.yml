name: Chunk Invella frontend
on:
  push:
    branches: [main]
    paths: ['.github/workflows/split-invella.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build resilient external asset bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          idx=Path('index.html'); s=idx.read_text(encoding='utf-8')
          app=Path('assets/invella-app.js').read_text(encoding='utf-8')
          def split_text(text,prefix,limit=10000):
              b=text.encode('utf-8'); out=[]
              while b:
                  cut=min(limit,len(b))
                  while cut and cut<len(b) and (b[cut]&0xC0)==0x80: cut-=1
                  out.append(b[:cut].decode('utf-8')); b=b[cut:]
              paths=[]
              for i,ch in enumerate(out,1):
                  p=Path(f'assets/{prefix}-{i:02d}.txt'); p.write_text(ch,encoding='utf-8'); paths.append(str(p))
              return paths
          app_parts=split_text(app,'app-part')
          sup_parts=split_text(Path('supabase.min.js').read_text(encoding='utf-8'),'supabase-part')
          css=[f'assets/invella-{i}.css' for i in range(1,8) if Path(f'assets/invella-{i}.css').exists()]
          s=re.sub(r'<link rel="stylesheet" href="/assets/invella-[1-9]\.css">','',s)
          s=s.replace('<script src="/supabase.min.js"></script>','').replace('<script src="/assets/invella-loader.js" defer></script>','').replace('<script src="/assets/invella-app.js" defer></script>','')
          base='https://raw.githubusercontent.com/kattestgai-bot/Invella/main/'
          boot="""<script>(function(){var B='BASE',C=CSS,S=SUP,A=APP;async function g(p){var r=await fetch(B+p,{cache:'no-cache'});if(!r.ok)throw Error(r.status);return r.text()}async function go(){try{var cs=await Promise.all(C.map(g));var st=document.createElement('style');st.textContent=cs.join('\\n');document.head.appendChild(st);var ss=await Promise.all(S.map(g));(0,eval)(ss.join(''));var aa=await Promise.all(A.map(g));(0,eval)(aa.join(''))}catch(e){console.error('Invella bootstrap',e);var d=document.createElement('div');d.style.cssText='position:fixed;z-index:99999;left:12px;right:12px;bottom:12px;padding:12px;background:#fff;border:1px solid #ddd;border-radius:12px;font:14px Arial';d.innerHTML='Не удалось загрузить сайт. <button onclick=\"location.reload()\">Повторить</button>';document.body.appendChild(d)}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go()})();</script>"""
          boot=boot.replace('BASE',base).replace('CSS',json.dumps(css)).replace('SUP',json.dumps(sup_parts)).replace('APP',json.dumps(app_parts))
          s=s.replace('</body>',boot+'</body>')
          idx.write_text(s,encoding='utf-8')
          print('index bytes',idx.stat().st_size,'app parts',len(app_parts),'supabase parts',len(sup_parts))
          PY
      - name: Validate
        run: |
          grep -q 'raw.githubusercontent.com/kattestgai-bot/Invella/main' index.html
          ! grep -q 'src="/supabase.min.js"' index.html
          ! grep -q 'href="/assets/invella-' index.html
          for f in assets/app-part-*.txt assets/supabase-part-*.txt; do test $(stat -c%s "$f") -lt 15000; done
      - name: Commit repair
        run: |
          git config user.name 'Invella Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/
          git diff --cached --quiet && exit 0
          git commit -m 'Bypass Vercel resets for frontend assets'
          git push
