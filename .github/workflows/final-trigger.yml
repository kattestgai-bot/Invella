name: Final current check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-trigger.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original editor layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/invella-premium-fix.js')
          s=p.read_text()
          m='/* editor-navigation-v13-loader */'
          if m in s:s=s.split(m)[0].rstrip()+'\n'
          addon=r'''
/* persistent-editor-url-v14 */
(function(){'use strict';
function restoreLayout(){var n=document.getElementById('invEditorNav');if(n)n.remove();document.querySelectorAll('#app .controls > [data-inv-section]').forEach(function(x){x.style.display='';x.removeAttribute('data-inv-section')})}
function wrap(){restoreLayout();if(window.editCloudInvitation&&!window.editCloudInvitation.__url14){var f=window.editCloudInvitation;window.editCloudInvitation=async function(id){sessionStorage.setItem('invella_edit_id',id);var u=new URL(location.href);u.pathname='/';u.search='?view=edit&id='+encodeURIComponent(id);history.replaceState({},'',u.pathname+u.search);var r=await f.apply(this,arguments);restoreLayout();return r};window.editCloudInvitation.__url14=1}if(window.openDashboard&&!window.openDashboard.__url14){var d=window.openDashboard;window.openDashboard=async function(){var r=await d.apply(this,arguments);history.replaceState({},'','/?view=invites');return r};window.openDashboard.__url14=1}}
function restore(){restoreLayout();var q=new URLSearchParams(location.search),v=q.get('view'),id=q.get('id');if(v==='invites'&&window.openDashboard)window.openDashboard();else if(v==='edit'&&id&&window.editCloudInvitation)window.editCloudInvitation(id)}
setInterval(wrap,600);setTimeout(restore,1200);})();
'''
          if '/* persistent-editor-url-v14 */' in s:s=s.split('/* persistent-editor-url-v14 */')[0].rstrip()
          p.write_text(s+'\n'+addon+'\n')
          h=Path('index.html');z=h.read_text();z=re.sub(r'\?v=20260910-[0-9]+','?v=20260910-1700',z);h.write_text(z)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Invella Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/invella-premium-fix.js
          git diff --cached --quiet || git commit -m 'Restore original single-page editor layout'
          git push