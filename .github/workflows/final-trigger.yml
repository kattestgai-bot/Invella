name: Final current check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-trigger.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate launch files
        shell: bash
        run: |
          test -s index.html
          test -s assets/invella-app.js
          test -s assets/invella-premium-fix.js
          grep -q "invMusic" assets/invella-premium-fix.js
          grep -q "view=edit" assets/invella-premium-fix.js
          echo "Launch files validated"